name: chat_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  google_fonts: ^8.0.2
  firebase_auth: ^6.3.0
  google_sign_in: ^7.2.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.4
  intl: 0.20.2
  image_picker: ^1.1.2
  firebase_storage: 13.4.1
  lucide_icons: ^0.257.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/Apple Color Emoji.ttf
    - assets/icons/

  fonts:
    - family: AppleEmoji
      fonts:
        - asset: assets/fonts/Apple Color Emoji.ttf